[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-api"
version = "0.1.0"
description = "Lumen multi-tenant RAG API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "fastembed>=0.4,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "litellm>=1.50,<2",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<6",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
lumen-api = "lumen.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
oidc = ["authlib>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
